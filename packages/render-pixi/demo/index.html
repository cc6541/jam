<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Screw Jam — banc de rendu</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e2433; overflow: hidden; touch-action: none; }
      #hud { position: fixed; top: 4px; right: 6px; font: 12px/1.3 ui-monospace, monospace; color: #fff;
             background: #000a; padding: 4px 6px; border-radius: 6px; z-index: 2; white-space: pre; }
      #bar { position: fixed; bottom: 4px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; z-index: 2; }
      #bar button { font: 13px system-ui; padding: 6px 10px; border-radius: 8px; border: 0; background: #3e8ef7; color: #fff; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="bar">
      <button id="prev">◀</button><button id="auto">Auto</button><button id="bench">Bench</button>
      <button id="restart">↺</button><button id="next">▶</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
